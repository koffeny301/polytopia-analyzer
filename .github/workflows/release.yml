name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sidecar + tarball (PyInstaller)
        run: |
          python -m pip install --upgrade pip pyinstaller
          PYTHON_BIN=python ./scripts/build_release.sh

      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sidecar в каталог Tauri
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp dist/polytopia-analyzer-*/polytopia-analyzer \
             desktop/src-tauri/binaries/polytopia-analyzer-x86_64-unknown-linux-gnu

      - name: Сборка AppImage (Tauri)
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles appimage

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            dist/polytopia-analyzer-*-linux-x86_64.tar.gz
            dist/polytopia-analyzer-*-linux-x86_64.tar.gz.sha256
