<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Polytopia Analyzer</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: #14161f; color: #e8e4d8;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    gap: 14px; text-align: center; padding: 24px; box-sizing: border-box;
  }
  .title { font-size: 22px; font-weight: 600; }
  .hint { color: #9a957f; font-size: 14px; max-width: 520px; line-height: 1.5; }
  .spin {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid #3a3d52; border-top-color: #d8b45a;
    animation: r 1s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  #err { display: none; color: #e07a6a; font-size: 14px; max-width: 640px;
         line-height: 1.55; white-space: pre-wrap; text-align: left;
         background: #1d1a24; border: 1px solid #4a3040; border-radius: 8px; padding: 12px 16px; }
</style>
</head>
<body>
  <div class="spin" id="spin"></div>
  <div class="title">Polytopia Analyzer</div>
  <div class="hint" id="hint">Запуск локального сервера…</div>
  <div id="err"></div>
<script>
function showAnalyzerError(msg) {
  document.getElementById('spin').style.display = 'none';
  document.getElementById('hint').textContent = 'Не удалось запустить приложение';
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = msg;
}
</script>
</body>
</html>
