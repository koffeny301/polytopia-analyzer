[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polytopia-match-analyzer"
version = "0.8.0"
description = "Анализ матчей The Battle of Polytopia: HTML-отчёты в стиле Civilization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "koffeny301" }]
dependencies = []

[project.urls]
Repository = "https://github.com/koffeny301/polytopia-analyzer"
Issues = "https://github.com/koffeny301/polytopia-analyzer/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]
ocr = ["pillow>=10", "pytesseract>=0.3.10"]

[project.scripts]
polytopia-analyzer = "polytopia_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["polytopia_analyzer*"]

[tool.setuptools.package-data]
polytopia_analyzer = ["assets/*.js", "assets/*.html", "assets/bin/*.so"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
