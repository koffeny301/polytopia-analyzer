[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polytopia-match-analyzer"
version = "0.1.0"
description = "Анализ матчей The Battle of Polytopia: HTML-отчёты в стиле Civilization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ocr = ["pillow>=10", "pytesseract>=0.3.10"]

[project.scripts]
polytopia-analyzer = "polytopia_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["polytopia_analyzer*"]

[tool.setuptools.package-data]
polytopia_analyzer = ["assets/*.js", "assets/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
